[project]
name = "agentsmind"
version = "0.1.0"
description = "AgentsMind: one workspace, every department."
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/characterization"]
markers = [
  "legacy_bug: pins current WRONG/insecure legacy behaviour; flip intentionally in a later phase",
]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["FYP_FINAL"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "E501"]
"db/migrations/**" = ["E501"]
