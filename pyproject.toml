[project]
name = "agentsmind"
version = "0.5.0"
description = "AgentsMind: one workspace, every department."
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/portals", "tests/mcp_servers_tests", "tests/assistant", "tests/characterization"]
markers = [
  "legacy_bug: pins current WRONG/insecure legacy behaviour; flip intentionally in a later phase",
]
addopts = "-p no:cacheprovider"
# A hung test (for example a subprocess that never answers) fails after 5 minutes and prints every
# thread's stack, instead of freezing the gate. Thread method: works on Windows.
timeout = 300
timeout_method = "thread"

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = ["FYP_FINAL"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentsmind", "portal_common", "finance_portal", "it_portal", "mcp_servers"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "E501"]
"db/migrations/**" = ["E501"]

[tool.coverage.run]
source = ["backend/agentsmind", "mcp_servers", "external_systems"]
omit = ["*/migrations/*", "*/seed.py", "mcp_servers/*/server.py"]  # servers run as subprocesses in tests
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = true
precision = 1

[tool.bandit]
exclude_dirs = ["tests", "FYP_FINAL", "frontend", ".venv"]
