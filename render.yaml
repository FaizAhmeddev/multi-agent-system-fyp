# Render Blueprint: New > Blueprint > pick this repository. See docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: agentsmind
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentsmind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AGENTSMIND_ADMIN_EMAIL
        sync: false
      - key: AGENTSMIND_ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: TIMEZONE
        value: Asia/Karachi

databases:
  - name: agentsmind-db
    plan: free
    databaseName: agentsmind
    user: agentsmind
